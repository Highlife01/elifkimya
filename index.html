      cursor: pointer;
      user-select: none;

    #elif-intro-splash.is-hiding {
      opacity: 0;
      transform: scale(1.08);
      visibility: hidden;
      pointer-events: none;
    }
    .elif-intro-wheel-wrap {
      position: relative;
      width: min(76vw, 390px);
      height: min(76vw, 390px);
      border-radius: 50%;
      padding: 10px;
      background: #ffffff;
      box-shadow: 0 28px 70px -15px rgba(5, 150, 105, 0.28), 0 0 0 1px rgba(16, 185, 129, 0.18);
      animation:
        elifIntroScaleIn 1.05s cubic-bezier(0.16, 1, 0.3, 1) forwards,
        elifIntroPulse 2.4s ease-in-out 1.05s infinite;
    }
    .elif-intro-wheel-wrap::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2.5px dashed rgba(5, 150, 105, 0.38);
      animation: elifIntroSpin 14s linear infinite;
      pointer-events: none;
    }
    .elif-intro-wheel-wrap::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #ef4444;
      border-right-color: #f97316;
      border-bottom-color: #eab308;
      border-left-color: #059669;
      animation: elifIntroSpinReverse 5.5s linear infinite;
      pointer-events: none;
    }
    .elif-intro-wheel-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
    }
    .elif-intro-wheel-inner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.55) 50%, transparent 70%);
      transform: translateX(-120%);
      animation: elifIntroShimmer 2.1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s infinite;
      pointer-events: none;
    }
    .elif-intro-wheel-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }
    .elif-intro-logo-wrap {
      margin-top: 22px;
      opacity: 0;
      transform: translateY(16px) scale(0.95);
      animation: elifIntroLogoReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.32s forwards;
    }
    .elif-intro-logo-img {
      width: min(68vw, 270px);
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 6px 16px rgba(15, 23, 42, 0.08));
    }
    .elif-intro-progress-track {
      margin-top: 18px;
      width: min(58vw, 250px);
      height: 5px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }
    .elif-intro-progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #dc2626 0%, #f97316 35%, #eab308 68%, #059669 100%);
      animation: elifIntroProgress 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes elifIntroScaleIn {
      0% { opacity: 0; transform: scale(0.45) rotate(-140deg); }
      70% { opacity: 1; transform: scale(1.03) rotate(4deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes elifIntroPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.022); }
    }
    @keyframes elifIntroSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes elifIntroSpinReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes elifIntroShimmer {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }
    @keyframes elifIntroLogoReveal {
      0% { opacity: 0; transform: translateY(16px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes elifIntroProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
